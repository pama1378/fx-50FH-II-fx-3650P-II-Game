<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CASIO fx-50F PLUS</title>
<style>
  :root{
    --body1:#2b2f36; --body2:#15181d;
    --key:#40464f; --key2:#31363e; --keytxt:#eef1f6;
    --gold:#d9a441; --red:#c8564a; --teal:#4a9c8c;
    --lcd1:#c9d4bb; --lcd2:#b3c1a2; --ink:#16200f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(120% 90% at 50% 0%,#20242b,#0a0c0f 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
    padding:10px;
  }
  .calc{
    width:min(420px,100%);
    background:linear-gradient(168deg,var(--body1) 0%,var(--body2) 55%,#0f1116 100%);
    border-radius:22px;padding:14px 14px 20px;
    box-shadow:0 30px 60px rgba(0,0,0,.75),0 2px 0 rgba(255,255,255,.06) inset,
               0 -2px 0 rgba(0,0,0,.6) inset;
    border:1px solid #000;
  }
  /* 品牌區 */
  .brand{display:flex;align-items:flex-end;justify-content:space-between;padding:2px 4px 8px}
  .brand .logo{font-size:15px;font-weight:800;letter-spacing:.16em;color:#e9edf3}
  .brand .model{text-align:right;line-height:1.15}
  .brand .model b{display:block;font-size:12px;letter-spacing:.06em;color:#dfe4ea}
  .brand .model span{font-size:8px;letter-spacing:.18em;color:#8b929c}

  /* 顯示屏 */
  .screen{
    background:linear-gradient(180deg,var(--lcd1),var(--lcd2));
    border-radius:6px;padding:7px 10px 9px;margin:0 2px 12px;
    border:2px solid #05070a;
    box-shadow:inset 0 4px 10px rgba(0,0,0,.42),inset 0 -2px 6px rgba(255,255,255,.25),
               0 1px 0 rgba(255,255,255,.08);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  .ind{height:11px;font-size:8.5px;letter-spacing:.1em;color:#33422a;text-align:right;
       white-space:nowrap;overflow:hidden}
  .line{font-size:24px;line-height:1.22;height:30px;color:var(--ink);text-align:right;
        overflow:hidden;white-space:nowrap;letter-spacing:.02em}
  .line.err{color:#70160c}
  .blink{animation:bk 1s steps(2) infinite}
  @keyframes bk{50%{opacity:.3}}

  /* 鍵盤 */
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:0 2px}
  .key{
    position:relative;height:47px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(180deg,var(--key) 0%,var(--key2) 100%);
    box-shadow:0 2px 0 #0b0d11,0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
    color:var(--keytxt);font-size:14px;font-weight:600;line-height:1;
    display:flex;align-items:center;justify-content:center;padding-top:6px;
    transition:transform .05s,filter .08s;
  }
  .key:active{transform:translateY(2px);box-shadow:0 0 0 #0b0d11,inset 0 2px 4px rgba(0,0,0,.5);filter:brightness(1.2)}
  .key .sh,.key .al{position:absolute;top:2px;font-size:7.5px;font-weight:700;letter-spacing:.02em;line-height:1}
  .key .sh{left:4px;color:var(--gold)}
  .key .al{right:4px;color:var(--red)}
  .key.num{font-size:16px}
  .key.fn{font-size:12px}
  .key.exe{background:linear-gradient(180deg,#5a6a86,#39445a);font-size:11px;letter-spacing:.04em}
  .key.shift{background:linear-gradient(180deg,#7a6226,#4d3d16);color:#f4d58a;font-size:10px}
  .key.alpha{background:linear-gradient(180deg,#7a3a33,#4a201c);color:#f0a79c;font-size:10px}
  .key.mode{background:linear-gradient(180deg,#3a4a46,#222c29);font-size:10px}
  .key.on{background:linear-gradient(180deg,#6d3a34,#3d1f1b);font-size:11px}
  .key.replay{font-size:11px;letter-spacing:.16em}
  .key .rev{font-size:9px;letter-spacing:.16em}

  @media (max-height:640px){
    .key{height:41px}
    .line{font-size:21px;height:26px}
  }
</style>
</head>
<body>
<div class="calc">
  <div class="brand">
    <div class="logo">CASIO</div>
    <div class="model"><b>fx-50F PLUS</b><span>S-V.P.A.M.</span></div>
  </div>

  <div class="screen">
    <div class="ind" id="ind"></div>
    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
  </div>

  <div class="pad" id="keypad"></div>
</div>
<script src="engine.bundle.js"></script>
<script src="programs.js"></script>
<script src="ui.js"></script>
</body>
</html>
